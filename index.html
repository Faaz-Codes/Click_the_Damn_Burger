<style>/* SNACKONOMICS retro-pixel shell */
:root {
  --bg: #171320;
  --panel: #241d33;
  --panel2: #2e2542;
  --ink: #f4e9d8;
  --dim: #a99bc4;
  --accent: #ffb02e;
  --accent2: #ff5d3a;
  --good: #7ed957;
  --line: #4a3f63;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'VT323', 'Courier New', monospace;
  font-size: 20px;
  line-height: 1.25;
  min-height: 100vh;
  display: flex;
  justify-content: center;
}
#app { width: 100%; max-width: 920px; padding: 14px; }
h1 {
  font-family: 'Press Start 2P', monospace;
  font-size: 18px;
  color: var(--accent);
  text-shadow: 3px 3px 0 var(--accent2);
  margin: 4px 0 14px;
}
.topbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.pill {
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 6px;
  padding: 6px 12px;
}
.pill.dim { opacity: .45; }
.pill.cur b { font-size: 18px; }
.pill b { color: var(--accent); font-size: 24px; }
.pill small { display: block; color: var(--dim); font-size: 14px; }
.stage {
  background: var(--panel);
  border: 3px solid var(--line);
  border-radius: 10px;
  padding: 16px;
  text-align: center;
  margin-bottom: 12px;
}
.burger {
  font-size: 80px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  display: inline-block;
  transition: transform .04s;
}
.burger:active { transform: scale(.92); }
.foodname { font-family: 'Press Start 2P', monospace; font-size: 13px; color: var(--ink); margin-top: 8px; }
.barwrap { height: 14px; background: #120d1e; border: 2px solid var(--line); border-radius: 6px; margin: 8px auto 0; max-width: 420px; overflow: hidden; }
.bar { height: 100%; background: var(--good); width: 0%; transition: width .15s; }
.tabs { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.tab {
  background: var(--panel2); color: var(--dim); border: 2px solid var(--line);
  border-radius: 6px 6px 0 0; padding: 6px 14px; cursor: pointer; font-size: 19px;
}
.tab.active { color: var(--accent); border-color: var(--accent); }
.list { display: grid; gap: 8px; }
.row {
  background: var(--panel); border: 2px solid var(--line); border-radius: 8px;
  padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
}
.row h3 { font-size: 21px; }
.row .meta { color: var(--dim); font-size: 16px; }
.row .owned { color: var(--accent); font-weight: bold; }
.row.locked { opacity: .5; }
button.buy {
  font-family: 'Press Start 2P', monospace; font-size: 10px; cursor: pointer;
  background: var(--accent); color: #1b1430; border: 0; border-radius: 6px; padding: 9px 12px;
  white-space: nowrap;
}
button.buy:disabled { background: #5a5170; color: #241d33; cursor: not-allowed; }
.notice { color: var(--accent2); min-height: 22px; }
.note { color: var(--dim); font-size: 16px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.72); display: none;
  align-items: center; justify-content: center; z-index: 50;
}
.overlay.open { display: flex; }
.card {
  background: var(--panel); border: 3px solid var(--line); border-radius: 10px;
  padding: 14px 16px; max-width: 500px; width: 92%; max-height: 82vh; overflow: auto;
}
.card h2 { font-family: 'Press Start 2P', monospace; font-size: 13px; color: var(--accent); margin-bottom: 10px; text-shadow: 2px 2px 0 #000; }
.card .kv { display: flex; justify-content: space-between; padding: 3px 0; gap: 12px; }
.card .kv b { color: var(--accent); }
.btn {
  font-family: 'Press Start 2P', monospace; font-size: 10px; cursor: pointer;
  background: var(--panel2); color: var(--ink); border: 2px solid var(--line); border-radius: 6px;
  padding: 7px 10px;
}
.btn:active { transform: translateY(2px); }
</style>
</head>

DATA.thresholdFor = function (n) {
  if (typeof n !== 'number') n = 1;
  const base = BigNum.fromNumber(CONFIG.THRESHOLD_BASE);
  const growth = BigNum.fromNumber(CONFIG.THRESHOLD_GROWTH);
  const exp = n - 1;
  const growthPow = BigNum.pow(growth, exp);
  const res = BigNum.mul(base, growthPow);
  return res;
};

// Upgrade trees (Task 6) - extend DATA from 01_data_core.js
(function extendUpgrades() {
  if (typeof DATA === 'undefined') return;
  if (!DATA.upgrades) {
    Object.assign(DATA, { upgrades: [] });
  }

  function genUpgradeEffect(tree, index, total) {
    var third = Math.floor(total / 3);
    var earlyCount = third;
    var midCount = third;
    var lateCount = total - earlyCount - midCount;
    if (lateCount < 0) lateCount = 0;
    var value = 0;
    var type = 'clickMult';
    if (index < earlyCount) {
      // early: value = 0.05 + 0.055 * index
      var iEarly = index;
      value = 0.05 + 0.055 * iEarly;
      if (tree === 'fry') type = 'prodMult';
      else if (tree === 'drink') type = 'fizzRate';
      else if (tree === 'chicken') type = 'chestLuck';
      else if (tree === 'food') type = 'prodMult'; // food tree percentages given separately, but generator still defined
    } else if (index < earlyCount + midCount) {
      // mid: value = 2 ** (1 + i) where i is index within mid third
      var iMid = index - earlyCount;
      value = Math.pow(2, 1 + iMid);
      if (tree === 'fry') type = 'critChance';
      else if (tree === 'drink') type = 'boosterDuration';
      else if (tree === 'chicken') type = 'chickenRate';
      else type = 'clickMult';
    } else {
      // late
      var iLate = index - earlyCount - midCount;
      value = Math.pow(10, 3 + 2 * iLate);
      if (tree === 'fry') type = 'critMult';
      else if (tree === 'drink') type = 'fizzRate';
      else if (tree === 'chicken') type = 'spiceGain';
      else type = 'clickMult';
    }
    return { type: type, value: value };
  }

  DATA.genUpgradeEffect = genUpgradeEffect;

  var upgrades = [];

  // FOOD tree - 25 upgrades (percentages fixed)

    'Slightly Better Ingredients',

  // NOTE: the original spec's late food values
  // (...1e6, 1e7, 1e8, 1e9) are NOT verbatim here.
  // §6.3 says the pacing table is the real constraint,

  // Lv50 window -- so the tail is capped near ~8e7
  // (multiplier ~x9e5), which is the largest value
  // that keeps the whole Lv2..Lv50 curve inside §6.3.
  var foodPercents = [5,10,15,25,30,40,50,75,100,150,250,400,600,1000,2500,
    5000,10000,25000,50000,100000,500000,2000000,6000000,20000000,50000000];
  for (var i = 0; i < foodNames.length; i++) {
    var fid = 'food_' + (i + 1);
    // The food tree leads with clickMult (the cheap early upgrades that
    // boost clicking AND the auto-click fleet, per design §7.4) and

    var foodType = i < 10 ? 'clickMult' : 'prodMult';
    // Cost scales with the effect it sells, raised to
    // a power steeper than linear: a late upgrade that
    // multiplies all production must be bought in the
    // late game, not the first minute. The exponent
    // (3.0) sets how quickly the tree's cumulative

    // multiplier is in place by mid-game (the late
    // machines then pay back in ~1s and income
    // explodes); steep enough and the tail upgrades
    // land near level 50, where they belong.
    var foodCost = 10 * Math.pow(foodPercents[i] / 5, 3.0);

// ---- Task 8b: achievements (115) and quips (40+) ----
//
// Achievement `check(state)` functions are non-throwing readers of the spec §4
// state shape. Plan 2's systems layer maintains the stats counters these read;
// where a currency or ownership value is a BigNum, the comparison uses BigNum.
function sstat(s, name, dflt) {
  try { const v = s && s.meta && s.meta.stats ? s.meta.stats[name] : undefined; return typeof v === 'number' ? v : dflt; } catch { return dflt; }
}
function lifeGE(s, m, e) { try { return BigNum.cmp(s.run.lifetimeGreaseThisRun, { m, e }) >= 0; } catch { return false; } }
function rateGE(s, m, e) { try { return BigNum.cmp(s.meta.stats.greasePerSec, { m, e }) >= 0; } catch { return false; } }
function ccyGE(s, id, m, e) { try { return BigNum.cmp(s.run.currencies[id], { m, e }) >= 0; } catch { return false; } }
function cloutGE(s, n) { try { return BigNum.cmp(s.meta.clout, { m: n, e: 0 }) >= 0; } catch { return false; } }
function countIn(map, s) { try { return Object.values(s.run[map] || {}).reduce((a, b) => a + b, 0); } catch { return 0; } }
function maxIn(map, s) { try { return Object.values(s.run[map] || {}).reduce((m, v) => Math.max(m, v), 0); } catch { return 0; } }
function hasIn(map, s, id) { try { return (s.run[map][id] || 0) > 0; } catch { return false; } }
function level(s, n) { try { return s.run.foodLevel >= n; } catch { return false; } }
function metaVal(s, path) { try { const p = path.split('.'); let v = s; for (const k of p) v = v == null ? undefined : v[k]; return v; } catch { return undefined; } }

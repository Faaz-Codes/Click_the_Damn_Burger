const BigNum = {
  norm(m, e) {
    if (m === 0) return { m: 0, e: 0 };
    let sign = m < 0 ? -1 : 1;
    let mm = Math.abs(m);
    let ee = e;
    while (mm >= 10) {
      mm /= 10;
      ee += 1;
    }
    while (mm < 1 && mm > 0) {
      mm *= 10;
      ee -= 1;
    }
    // Guard against mm becoming >= 10 due to floating point edge cases
    if (mm >= 10) {
      mm /= 10;
      ee += 1;
    }
    return { m: sign * mm, e: ee };
  },

  fromNumber(n) {
    if (n === 0) return { m: 0, e: 0 };
    let sign = n < 0 ? -1 : 1;
    let val = Math.abs(n);
    let e = Math.floor(Math.log10(val));
    let m = val / Math.pow(10, e);
    let res = BigNum.norm(sign * m, e);
    return res;
  },

  // Accepted input, tried in this order:
  //   "m|e"        compact save form, e.g. "-1.234|3"
  //   "1.234e18"   scientific notation; "E" and a leading "+" are allowed
  //   "1234", "1.234", "0.5", ".5"   ordinary decimal text, signed either way
  // Input that carries no number at all ("" or "abc") reports zero, and so does
  // a compact pair that is not two numeric halves. The reason is the save path:
  // fromString parses saved currencies, and the save validator rejects a NaN
  // mantissa outright, so a poisoned pair costs the player their session. A zero
  // is at least visible and recoverable, and it matches this method's own policy
  // for a non-string -- zero, not an exception -- so fromString never throws and
  // a corrupt field cannot take the boot path down with it. Signed zero ("-0",
  // "-0.0") is the same zero: norm collapses any m === 0 to { m: 0, e: 0 }.
  fromString(s) {
    if (typeof s !== 'string') return { m: 0, e: 0 };
    s = s.trim();
    if (s === '0' || s === '0.0') return { m: 0, e: 0 };
    // Compact save form: a normalised mantissa and its exponent. Each half must
    // be a plain decimal -- the format never nests an exponent inside either
    // one -- so "1e5|3" is a file that is not in the format and is read as the
    // corrupt field it is, not as 1e5 times 10^3. The exponent half keeps its
    // decimal point so a sqrt result, whose exponent can be a half, survives.
    if (s.includes('|')) {
      const plain = /^[+-]?(\d+(\.\d*)?|\.\d+)$/;
      const halves = s.split('|');
      if (halves.length !== 2 || !plain.test(halves[0]) || !plain.test(halves[1])) return { m: 0, e: 0 };
      return BigNum.norm(Number(halves[0]), Number(halves[1]));
    }
    // Handle scientific notation
    if (s.includes('e') || s.includes('E')) {
      const [mantStr, expStr] = s.split(/[eE]/);
      const exp = parseInt(expStr, 10);
      const parsed = BigNum.parseMantissa(mantStr);
      if (!Number.isFinite(exp) || !Number.isFinite(parsed.m) || !Number.isFinite(parsed.e)) return { m: 0, e: 0 };
      return BigNum.norm(parsed.m, parsed.e + exp);
    }
    const parsed = BigNum.parseMantissa(s);
    if (!Number.isFinite(parsed.m) || !Number.isFinite(parsed.e)) return { m: 0, e: 0 };
    return BigNum.norm(parsed.m, parsed.e);
  },

  parseMantissa(s) {
    // Parse a mantissa string without exponent, e.g. "1234", "1.234", ".5" style not needed
    if (s.includes('.')) {
      const [intPart, fracPart] = s.split('.');
      const intVal = intPart === '' ? 0 : parseInt(intPart, 10);
      const fracStr = fracPart;
      const fracVal = fracStr.length === 0 ? 0 : parseInt(fracStr, 10);
      if (intVal === 0) {
        // "0.5", ".5", "-0.5": the integer part contributes nothing, so the
        // digits after the point are the whole number and the point only sets
        // the exponent. Dividing the mantissa by that same power of ten as well
        // counted it twice, which is why "0.5" used to read as 0.05.
        // intVal has already thrown the sign away (parseInt reads "-0" as zero),
        // so the sign is recovered from the text.
        const e = -fracStr.length;
        const m = intPart.charAt(0) === '-' ? -fracVal : fracVal;
        return { m, e };
      }
      const totalStr = intPart + fracPart;
      const m = parseFloat(intPart === '0' ? '0.' + fracPart : totalStr.length === 1 ? totalStr : intPart + '.' + fracPart.replace(/^0+/, '') || '0');
      // Easier: just compute
      const num = parseFloat(s);
      if (num >= 1 && num < 10) return { m: num, e: 0 };
      if (num >= 10) {
        const e = Math.floor(Math.log10(num));
        return { m: num / Math.pow(10, e), e };
      }
      if (num > 0 && num < 1) {
        const e = -Math.floor(Math.log10(1 / num));
        return { m: num * Math.pow(10, e), e };
      }
      return { m: num, e: 0 };
    } else {
      const num = parseInt(s, 10);
      if (num === 0) return { m: 0, e: 0 };
      // log10 of a negative is NaN, which would poison the exponent and the
      // mantissa with it. Take the magnitude, then put the sign back on the
      // mantissa; for a positive num this is the same arithmetic as before.
      const sign = num < 0 ? -1 : 1;
      const abs = Math.abs(num);
      const e = Math.floor(Math.log10(abs));
      const m = sign * (abs / Math.pow(10, e));
      return { m, e };
    }
  },

  toNumber(a) {
    if (a.m === 0) return 0;
    return a.m * Math.pow(10, a.e);
  },

  add(a, b) {
    if (a.m === 0) return { m: b.m, e: b.e };
    if (b.m === 0) return { m: a.m, e: a.e };
    let m1 = a.m;
    let e1 = a.e;
    let m2 = b.m;
    let e2 = b.e;
    if (e1 > e2) {
      const diff = e1 - e2;
      m2 = m2 / Math.pow(10, diff);
      e2 = e1;
    } else if (e2 > e1) {
      const diff = e2 - e1;
      m1 = m1 / Math.pow(10, diff);
      e1 = e2;
    }
    const mSum = m1 + m2;
    return BigNum.norm(mSum, e1);
  },

  sub(a, b) {
    if (b.m === 0) return { m: a.m, e: a.e };
    const negB = { m: -b.m, e: b.e };
    return BigNum.add(a, negB);
  },

  mul(a, b) {
    if (a.m === 0 || b.m === 0) return { m: 0, e: 0 };
    return BigNum.norm(a.m * b.m, a.e + b.e);
  },

  div(a, b) {
    if (b.m === 0) return { m: 1, e: Number.POSITIVE_INFINITY };
    if (a.m === 0) return { m: 0, e: 0 };
    return BigNum.norm(a.m / b.m, a.e - b.e);
  },

  cmp(a, b) {
    const m1 = a.m;
    const m2 = b.m;
    if (m1 === 0 && m2 === 0) return 0;
    if (m1 === 0) return -1 * Math.sign(m2);
    if (m2 === 0) return Math.sign(m1);
    if (m1 < 0 && m2 >= 0) return -1;
    if (m1 >= 0 && m2 < 0) return 1;
    // Same sign, compare magnitude
    const sign = m1 < 0 ? -1 : 1;
    if (a.e > b.e) return sign;
    if (a.e < b.e) return -sign;
    if (m1 > m2) return sign;
    if (m1 < m2) return -sign;
    return 0;
  },

  floor(a) {
    if (a.m === 0) return { m: 0, e: 0 };
    if (a.e >= 0) {
      const shift = Math.pow(10, a.e);
      const floored = Math.floor(a.m * shift);
      return BigNum.norm(floored, 0);
    } else {
      const fracDigits = -a.e;
      const pow10 = Math.pow(10, fracDigits);
      const val = Math.floor(a.m * pow10) / pow10;
      return BigNum.norm(val, a.e);
    }
  },

  sqrt(a) {
    if (a.m === 0) return { m: 0, e: 0 };
    // sqrt(a.m * 10^e) = sqrt(a.m) * 10^(e/2)
    return BigNum.norm(Math.sqrt(Math.abs(a.m)), a.e / 2);
  },

  log10(a) {
    if (a.m === 0) return -Infinity;
    return Math.log10(a.m) + a.e;
  },

  isZero(a) {
    return a.m === 0;
  },

  pow(a, n) {
    if (typeof n !== 'number') n = 0;
    if (n === 0) return { m: 1, e: 0 };
    if (a.m === 0) return { m: 0, e: 0 };
    const x = Math.abs(a.m);
    const eTotal = a.e;
    const r = n * (Math.log10(x) + eTotal);
    // Re-derive from mantissa [1,10): m_exp = 10^frac, e_exp = floor(r)
    const eExp = Math.floor(r);
    const frac = r - eExp;
    let mExp = Math.pow(10, frac);
    if (mExp >= 10) {
      mExp = mExp / 10;
      // eExp adjusted conceptually, but better to renorm
    }
    // Use norm to ensure [1,10)
    let res = BigNum.norm(mExp, eExp);
    if (res.m >= 10) {
      res = { m: res.m / 10, e: res.e + 1 };
    }
    if (res.m < 1 && res.m > 0) {
      res = { m: res.m * 10, e: res.e - 1 };
    }
    // Handle edge cases from floating point - ensure normalized
    if (res.m >= 1 && res.m < 10) {
      // OK
    }
    return res;
  }
};

// Display formatting. Every value printed here is read out of CONFIG at call
// time, never at module-evaluation time: 00_config.js is concatenated first, so
// by the time these functions run the CONFIG literal exists.
const FMT_PLAIN_LIMIT = 1000; // below this a count reads best with no decimals
const FMT_TIER_ORDERS = 3; // orders of magnitude covered by one SUFFIXES entry
const FMT_MANTISSA_PLACES = 3; // decimal places shown on a 1..10 mantissa
const FMT_ROUND_RESOLUTION = 2; // finest resolution the default display rounds at
const FMT_MIN_PLACES = 0; // smallest opts.decimals that is honoured
// A scaled mantissa is always in [1,1000), so six decimals is at most nine
// significant digits and stays inside the precision a double actually carries.
// Asking for more would print the binary approximation of the value (15.4 would
// become 15.40000000000000035527), which is a lie rather than a rounding.
const FMT_MAX_PLACES = 6;
const FMT_UNAVAILABLE = '--'; // stands in for a value that is not a finite bignum

const fmt = {
  notation: 'standard',

  setNotation(mode) {
    if (mode === 'standard' || mode === 'scientific' || mode === 'engineering') {
      fmt.notation = mode;
    }
  },

  // num(bignum, { decimals }) -> display string in the current notation.
  // opts.decimals is honoured only within [FMT_MIN_PLACES, FMT_MAX_PLACES];
  // anything else is treated as absent and the display default applies.
  num(a, opts) {
    const places = fmtPlaces(opts);
    if (!a || BigNum.isZero(a)) return '0';
    // A corrupt mantissa or exponent has no rendering. Say so rather than
    // letting NaN and undefined reach the screen.
    if (!Number.isFinite(a.m) || !Number.isFinite(a.e)) return FMT_UNAVAILABLE;
    const sign = a.m < 0 ? '-' : '';
    const abs = { m: Math.abs(a.m), e: a.e };
    if (fmt.notation === 'scientific') return fmtScientific(abs, places, sign);
    if (fmt.notation === 'engineering') return fmtEngineering(abs, places, sign);
    return fmtStandard(abs, places, sign);
  }
};

// opts.decimals is a count of decimal places, so only a whole number inside the
// accepted range is honoured. Everything else is ignored rather than clamped:
// clamping guesses at intent (-1 is a mistake, not a request for zero decimals,
// and clamping upward to toFixed's ceiling of 100 would emit a hundred-character
// label), and ignoring is the policy setNotation already applies to a mode it
// does not recognise.
function fmtPlaces(opts) {
  const requested = opts && opts.decimals;
  if (typeof requested !== 'number' || !Number.isInteger(requested)) return undefined;
  if (requested < FMT_MIN_PLACES || requested > FMT_MAX_PLACES) return undefined;
  return requested;
}

// Standard: plain integers under 1000, then K/M/B/... with 2-3 significant decimals.
function fmtStandard(abs, places, sign) {
  const magnitude = BigNum.log10(abs);
  let tier;
  let scaled;
  if (magnitude < Math.log10(FMT_PLAIN_LIMIT)) {
    const plain = Math.round(abs.m * Math.pow(10, abs.e));
    if (plain < FMT_PLAIN_LIMIT) return sign + String(plain);
    // 999.9 rounds up to a whole 1000: that is a K value, not a plain count.
    tier = 1;
    scaled = abs.m * Math.pow(10, abs.e - FMT_TIER_ORDERS);
  } else {
    tier = Math.floor(magnitude / FMT_TIER_ORDERS);
    // |m| is in [1,10) and the power lands in [-2,2), so this cannot overflow.
    scaled = abs.m * Math.pow(10, abs.e - tier * FMT_TIER_ORDERS);
  }
  const before = scaled;
  if (places === undefined) {
    // Round at the finest resolution the default display uses, then shed
    // decimals as the magnitude grows: >= 100 shows none, >= 10 one, else two.
    scaled = fmtRound(scaled, FMT_ROUND_RESOLUTION);
    if (scaled >= 100) scaled = fmtRound(scaled, 0);
    else if (scaled >= 10) scaled = fmtRound(scaled, 1);
  } else {
    scaled = fmtRound(scaled, places);
  }
  // A mantissa that rounds up to a whole 1000 belongs to the next tier.
  if (scaled >= FMT_PLAIN_LIMIT) {
    tier += 1;
    scaled = fmtRound(scaled / FMT_PLAIN_LIMIT, places !== undefined ? places : FMT_ROUND_RESOLUTION);
  }
  // Rounding that carried the mantissa across a power of ten (9.999 -> 10.00)
  // landed in a magnitude that shows fewer decimals than were asked for.
  if (places !== undefined && fmtDecade(scaled) !== fmtDecade(before)) {
    places = Math.min(places, fmtDefaultPlaces(scaled));
  }
  if (tier >= CONFIG.SUFFIXES.length) return fmtScientific(abs, places, sign);
  const decimals = places !== undefined ? places : fmtDefaultPlaces(scaled);
  return sign + scaled.toFixed(decimals) + CONFIG.SUFFIXES[tier];
}

// The pinned display rule, by magnitude: 100 or more shows no decimals, 10 or
// more shows one, anything smaller shows two.
function fmtDefaultPlaces(scaled) {
  if (scaled >= 100) return 0;
  if (scaled >= 10) return 1;
  return 2;
}

// Which power of ten a positive value sits in, used to spot a rounding carry.
function fmtDecade(value) {
  return Math.floor(Math.log10(value));
}

// Scientific: normalised mantissa and true exponent, e.g. 1.234e18.
function fmtScientific(abs, places, sign) {
  return sign + fmtMantissa(abs, places) + 'e' + abs.e;
}

// Engineering: exponent rounded up to a multiple of three, e.g. 0.123e21.
function fmtEngineering(abs, places, sign) {
  const exponent = Math.ceil(abs.e / FMT_TIER_ORDERS) * FMT_TIER_ORDERS;
  const rescaled = { m: abs.m * Math.pow(10, abs.e - exponent), e: exponent };
  return sign + fmtMantissa(rescaled, places) + 'e' + exponent;
}

function fmtMantissa(abs, places) {
  return abs.m.toFixed(places !== undefined ? places : FMT_MANTISSA_PLACES);
}

function fmtRound(value, places) {
  const factor = Math.pow(10, places);
  return Math.round(value * factor) / factor;
}

// Utilities: seeded randomness, calendar-day arithmetic, a storage shim that
// cannot take the game down, and two small containers. Nothing here reads
// CONFIG or BigNum; these are the primitives everything else is built on.

/* Randomness -------------------------------------------------------------- */

// mulberry32's odd increment, and 2**32, which maps the 32-bit state into [0, 1).
const RNG_MIX = 0x6D2B79F5;
const RNG_SCALE = 4294967296;

// rng(seed?) -> () => number in [0, 1). A seeded generator replays the same
// stream forever, which is what lets a daily roll be reasoned about and tested;
// with no seed it draws its starting state from Math.random. The state is forced
// to 32 bits (the `| 0`) so it cannot drift into float territory and lose the
// low-order bits a draw depends on.
function rng(seed) {
  let state = seed === undefined ? (Math.random() * RNG_SCALE) >>> 0 : seed | 0;
  return function () {
    state = (state + RNG_MIX) | 0;
    let t = state;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / RNG_SCALE;
  };
}

// rngPick(arr, r) -> a uniformly chosen item. The source is passed in so a
// caller can draw from a seeded stream.
function rngPick(arr, r) {
  return arr[Math.floor(r() * arr.length)];
}

// rngWeighted(entries, r) -> the chosen entry, by relative weight. The weights
// are not probabilities and need not sum to 1: they are normalised against their
// own total here, so 3:1 and 0.75:0.25 behave alike. A zero weight is
// unreachable -- the walk steps over it -- and a table with no weight at all has
// nothing to return, reported as undefined rather than as a zero-weight entry.
function rngWeighted(entries, r) {
  let total = 0;
  for (const e of entries) if (e.weight > 0) total += e.weight;
  if (total <= 0) return undefined;
  let roll = r() * total;
  let walked = 0;
  let last = null;
  for (const e of entries) {
    if (!(e.weight > 0)) continue;
    last = e;
    walked += e.weight;
    if (roll < walked) return e;
  }
  return last; // only reachable if the source returned exactly 1
}

// rngInt(minInclusive, maxExclusive, r) -> a whole number in [min, max).
function rngInt(minInclusive, maxExclusive, r) {
  return minInclusive + Math.floor(r() * (maxExclusive - minInclusive));
}

/* Dates ------------------------------------------------------------------- */

const MS_PER_DAY = 86400000;
const DKEY_PATTERN = /^(\d{4})-(\d{2})-(\d{2})$/;

function pad2(n) {
  return n < 10 ? '0' + n : String(n);
}

// dkey(ts?) -> 'YYYY-MM-DD' for the player's own calendar day. The local getters
// are the point: a player in UTC+14 opening the game at 09:00 is on their local
// date, not on yesterday's UTC one, and it is their local date that decides
// whether the daily reward is theirs to collect. Fields are zero-padded because
// this string is both a storage key and a parseDateKey argument, and
// '2026-1-6' is not the same key as '2026-01-06'.
function dkey(ts) {
  const date = ts === undefined ? new Date() : new Date(ts);
  return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
}

// parseDateKey(key) -> { y, m, d }, the month numbered the way the key is
// written: 1 is January, matching the day beside it and the ISO key it came
// from. Anything that is not a padded 'YYYY-MM-DD' key parses to null rather
// than to a date nobody wrote -- a save file can be corrupt, and the callers
// here are the boot path.
function parseDateKey(key) {
  const parts = DKEY_PATTERN.exec(key);
  if (!parts) return null;
  return { y: Number(parts[1]), m: Number(parts[2]), d: Number(parts[3]) };
}

// daysBetween(aKey, bKey) -> the signed number of calendar days from a to b.
// Both keys are anchored to UTC midnight before subtracting, and that is the
// entire implementation: anchored in UTC, the delta is a whole number of
// MS_PER_DAY blocks whatever the local zone did in between. The obvious reading
// -- build the same two dates at local midnight and divide -- measures a 23h
// or 25h day across a DST transition and answers 1.958 or 2.041, dropping a day
// from a streak the player already earned.
function daysBetween(aKey, bKey) {
  const a = parseDateKey(aKey);
  const b = parseDateKey(bKey);
  if (!a || !b) return NaN;
  return (utcMidnight(b) - utcMidnight(a)) / MS_PER_DAY;
}

function utcMidnight({ y, m, d }) {
  return Date.UTC(y, m - 1, d);
}

/* Storage ----------------------------------------------------------------- */

const STORE_PROBE_KEY = '__snackonomics_probe__';

// makeStore(storage?) -> { get, set, remove, persistent }. Saving must never be
// the reason the game does not start, so nothing here throws: a storage that
// refuses (private browsing, a full quota, an embedded frame with no
// localStorage) costs the player their progress between visits, never their
// session. `persistent` is read, not called: it says whether values are
// reaching real storage right now, and it is raised only after a probe write.
function makeStore(storage = globalThis.localStorage) {
  const memory = new Map();
  const store = {
    persistent: false,

    get(key) {
      if (store.persistent) {
        try {
          return storage.getItem(key);
        } catch (err) {
          store.persistent = false; // the quota ran out or access was revoked
        }
      }
      return memory.has(key) ? memory.get(key) : null;
    },

    // Values are stored as the strings localStorage takes; the caller serialises.
    set(key, value) {
      if (store.persistent) {
        try {
          storage.setItem(key, value);
          return;
        } catch (err) {
          store.persistent = false;
        }
      }
      memory.set(key, value);
    },

    remove(key) {
      memory.delete(key);
      if (store.persistent) {
        try {
          storage.removeItem(key);
        } catch (err) {
          store.persistent = false;
        }
      }
    }
  };

  // Feature detection cannot tell here: an unusable storage has the methods and
  // throws from them, so the only test is a write. The probe key is reserved,
  // and is removed again immediately, leaving no trace when it succeeds.
  try {
    if (storage) {
      storage.setItem(STORE_PROBE_KEY, '1');
      storage.removeItem(STORE_PROBE_KEY);
      store.persistent = true;
    }
  } catch (err) {
    store.persistent = false;
  }
  return store;
}

/* Events ------------------------------------------------------------------ */

class Emitter {
  constructor() {
    this.handlers = new Map();
  }

  // on(evt, fn) -> offFn. The returned function is the ergonomic way to
  // unsubscribe, and it is idempotent: a component that tears down twice does
  // not have to know whether it already did.
  on(evt, fn) {
    if (!this.handlers.has(evt)) this.handlers.set(evt, []);
    this.handlers.get(evt).push(fn);
    let subscribed = true;
    return () => {
      if (!subscribed) return;
      subscribed = false;
      this.off(evt, fn);
    };
  }

  // Removing a listener that was never added is not an error: the caller wants
  // it gone, and it is.
  off(evt, fn) {
    const listeners = this.handlers.get(evt);
    if (!listeners) return;
    const at = listeners.indexOf(fn);
    if (at >= 0) listeners.splice(at, 1);
  }

  emit(evt, payload) {
    const listeners = this.handlers.get(evt);
    if (!listeners) return;
    // Copied first, because a handler is allowed to unsubscribe itself or a
    // sibling while this loop is running.
    for (const fn of listeners.slice()) fn(payload);
  }
}

/* Objects ----------------------------------------------------------------- */

// A fixed-size bag of pre-built objects: Pool(factory, size) runs the factory
// exactly `size` times, at construction, and never again. `get` on a drained
// pool recycles an object that is already checked out instead of building one
// more, so a runaway loop of get() calls cannot grow the heap -- the caller may
// then be handed something it already holds, which is the right trade for
// effects the game would rather reuse than allocate.
class Pool {
  constructor(factory, size) {
    this.items = [];
    this.free = [];
    this.cursor = 0;
    for (let i = 0; i < size; i++) {
      const item = factory();
      this.items.push(item);
      this.free.push(item);
    }
  }

  get() {
    if (this.free.length > 0) return this.free.pop();
    const item = this.items[this.cursor];
    this.cursor = this.cursor + 1 >= this.items.length ? 0 : this.cursor + 1;
    return item; // a pool of size 0 has nothing to give and says so
  }

  release(item) {
    if (this.free.indexOf(item) >= 0) return; // already out, handing it back twice
    this.free.push(item);
  }
}

// Cross-table data validator. Runs over the DATA tables and returns a list of
// human-readable problems; an empty list means the data is valid. build.js calls
// this and fails the build on any non-empty result, so a typo in a data file is
// caught at build time rather than shipping as a permanently greyed-out button.
//
// Designed to document the spec contract:
//   - every id is unique within its table
//   - every effect.type is one the systems layer knows how to apply
//   - every cost has a positive amount and a real currency
//   - every levelReq is reachable (1..50)
//   - every food's locationId maps to a real location that covers it
//   - every reward kind is one of the five the game actually grants
//   - every booster / buff / upgrade / currency reward id resolves to a real entry
//   - the requires graph never loops
//
// The last two are where data typos turn into broken rewards: a dangling id
// means a chest pays out nothing, and a requires cycle would lock an upgrade.

const EFFECT_TYPES = new Set(['clickMult', 'prodMult', 'critChance', 'critMult', 'fryRate', 'fizzRate', 'chickenRate', 'boosterDuration', 'chestLuck', 'offlineEff', 'costReduction', 'spiceGain', 'cloutGain', 'comboDecayResist', 'forceCrit']);
const REWARD_KINDS = new Set(['currency', 'booster', 'buff', 'upgrade', 'permanent']);

function pushUnique(errors, items, tableName, keyer) {
  const seen = new Set();
  for (const item of items) {
    const id = keyer(item);
    if (id === undefined || id === null) continue;
    if (seen.has(id)) errors.push(`${tableName}: duplicate id "${id}"`);
    seen.add(id);
  }
}

function validateTables(data) {
  const D = data || (typeof DATA !== 'undefined' ? DATA : null);
  if (!D) return ['DATA is not defined'];
  const errors = [];

  // --- unique ids everywhere ---
  pushUnique(errors, D.currencies, 'currencies', c => c.id);
  pushUnique(errors, D.foodLevels, 'foodLevels', f => f.id);
  pushUnique(errors, D.locations, 'locations', l => l.id);
  pushUnique(errors, D.upgrades, 'upgrades', u => u.id);
  pushUnique(errors, D.employees, 'employees', e => e.id);
  pushUnique(errors, D.automation, 'automation', a => a.id);
  pushUnique(errors, D.boosters, 'boosters', b => b.id);
  pushUnique(errors, D.chests, 'chests', c => c.id);
  pushUnique(errors, D.buffs, 'buffs', b => b.id);
  pushUnique(errors, D.achievements, 'achievements', a => a.id);

  // --- upgrade fields + graph ---
  const upgradeIds = new Set(D.upgrades.map(u => u.id));
  for (const u of D.upgrades) {
    if (typeof u.name !== 'string' || !u.name) errors.push(`upgrade ${u.id}: missing name`);
    if (typeof u.desc !== 'string' || !u.desc) errors.push(`upgrade ${u.id}: missing desc`);
    if (!u.cost || !(u.cost.amount > 0)) errors.push(`upgrade ${u.id}: non-positive or missing cost.amount (${u.cost && u.cost.amount})`);
    const cur = u.cost && u.cost.currency;
    if (!D.currencies.some(c => c.id === cur)) errors.push(`upgrade ${u.id}: unknown cost.currency "${cur}"`);
    if (!u.effect || !EFFECT_TYPES.has(u.effect.type)) errors.push(`upgrade ${u.id}: unknown effect.type "${u.effect && u.effect.type}"`);
    if (typeof u.effect.value !== 'number') errors.push(`upgrade ${u.id}: effect.value is not a number`);
    if (!Number.isInteger(u.levelReq) || u.levelReq < 1 || u.levelReq > 50) errors.push(`upgrade ${u.id}: levelReq ${u.levelReq} out of 1..50`);
    if (u.requires) {
      for (const r of u.requires) {
        if (!upgradeIds.has(r)) errors.push(`upgrade ${u.id}: requires unknown upgrade "${r}"`);
      }
    }
  }

  // requires cycle detection over the upgrade graph (bounded, no hang)
  const onStack = new Set();
  const done = new Set();
  function visit(id, path) {
    if (done.has(id)) return;
    if (onStack.has(id)) {
      errors.push(`upgrade requires cycle detected: ${path.concat([id]).join(' -> ')}`);
      return;
    }
    onStack.add(id);
    const u = D.upgrades.find(x => x.id === id);
    if (u && Array.isArray(u.requires)) {
      for (const r of u.requires) visit(r, path.concat([id]));
    }
    onStack.delete(id);
    done.add(id);
  }
  for (const u of D.upgrades) visit(u.id, []);

  // --- food levels: location mapping + order ---
  const locationIds = new Set(D.locations.map(l => l.id));
  D.foodLevels.forEach((f, i) => {
    if (f.id === undefined) errors.push(`foodLevels[${i}]: missing id`);
    if (!locationIds.has(f.locationId)) errors.push(`foodLevels[${i}] "${f.name}": unknown locationId "${f.locationId}"`);
    else {
      const loc = D.locations.find(l => l.id === f.locationId);
      if (i + 1 < loc.levelFrom || i + 1 > loc.levelTo) errors.push(`foodLevels[${i}] "${f.name}" not covered by location "${loc.id}" (${loc.levelFrom}-${loc.levelTo})`);
    }
    if (typeof f.threshold !== 'number' || !(f.threshold > 0)) errors.push(`foodLevels[${i}] "${f.name}": bad threshold`);
  });

  // --- locations tile 1..50 ---
  let covered = 0;
  for (const l of D.locations) {
    if (typeof l.levelFrom !== 'number' || typeof l.levelTo !== 'number') { errors.push(`location "${l.id}": bad level range`); continue; }
    covered += (l.levelTo - l.levelFrom + 1);
  }
  if (covered !== 50) errors.push(`locations cover ${covered} levels, need 50`);

  // --- boosters ---
  for (const b of D.boosters) {
    if (typeof b.effect?.type !== 'string' || !EFFECT_TYPES.has(b.effect.type)) errors.push(`booster ${b.id}: unknown effect.type "${b.effect && b.effect.type}"`);
    if (!(b.durationMs > 0)) errors.push(`booster ${b.id}: non-positive durationMs`);
  }

  // --- chests + tables + pity ---
  const boosterIds = new Set(D.boosters.map(b => b.id));
  const currencyIds = new Set(D.currencies.map(c => c.id));
  const buffIds = new Set(D.buffs.map(b => b.id));
  const upgradeIdSet = new Set(D.upgrades.map(u => u.id));
  for (const t of D.chestTables) {
    if (!Array.isArray(t.entries) || t.entries.length === 0) errors.push(`chestTable tier ${t.tier}: empty entries`);
    for (const e of t.entries) {
      if (!(e.weight > 0)) errors.push(`chestTable tier ${t.tier}: non-positive weight for "${e.id}"`);
      if (!REWARD_KINDS.has(e.kind)) errors.push(`chestTable tier ${t.tier}: illegal reward kind "${e.kind}"`);
      if (e.kind !== 'permanent') {
        if (e.kind === 'currency' && !currencyIds.has(e.id)) errors.push(`chestTable tier ${t.tier}: unknown currency "${e.id}"`);
        if (e.kind === 'booster' && !boosterIds.has(e.id)) errors.push(`chestTable tier ${t.tier}: unknown booster "${e.id}"`);
        if (e.kind === 'buff' && !buffIds.has(e.id)) errors.push(`chestTable tier ${t.tier}: unknown buff "${e.id}"`);
        if (e.kind === 'upgrade' && !upgradeIdSet.has(e.id)) errors.push(`chestTable tier ${t.tier}: unknown upgrade "${e.id}"`);
      }
    }
  }
  if (!(D.chestPity.epicAfter > 0)) errors.push('chestPity.epicAfter must be > 0');
  if (!(D.chestPity.legendaryAfter > D.chestPity.epicAfter)) errors.push('chestPity.legendaryAfter must exceed epicAfter');

  // --- buffs ---
  for (const b of D.buffs) {
    if (typeof b.effect?.type !== 'string' || !EFFECT_TYPES.has(b.effect.type)) errors.push(`buff ${b.id}: unknown effect.type "${b.effect && b.effect.type}"`);
    if (!(b.durationMs > 0)) errors.push(`buff ${b.id}: non-positive durationMs`);
    if (typeof b.desc !== 'string' || !b.desc) errors.push(`buff ${b.id}: missing desc`);
  }

  // --- dailies + milestones reference only real reward ids ---
  for (const d of D.dailyCalendar) {
    if (!Array.isArray(d.rewards) || d.rewards.length === 0) errors.push(`dailyCalendar day ${d.day}: empty rewards`);
    for (const r of d.rewards) {
      if (!REWARD_KINDS.has(r.kind)) errors.push(`dailyCalendar day ${d.day}: illegal kind "${r.kind}"`);
      else if (r.kind === 'currency' && !currencyIds.has(r.id)) errors.push(`dailyCalendar day ${d.day}: unknown currency "${r.id}"`);
      else if (r.kind === 'booster' && !boosterIds.has(r.id)) errors.push(`dailyCalendar day ${d.day}: unknown booster "${r.id}"`);
      else if (r.kind === 'buff' && !buffIds.has(r.id)) errors.push(`dailyCalendar day ${d.day}: unknown buff "${r.id}"`);
      else if (r.kind === 'upgrade' && !upgradeIdSet.has(r.id)) errors.push(`dailyCalendar day ${d.day}: unknown upgrade "${r.id}"`);
    }
  }
  const mileDays = D.streakMilestones.map(m => m.day);
  if (JSON.stringify(mileDays) !== JSON.stringify([3, 7, 14, 30, 50, 100, 365])) errors.push(`streakMilestones days != [3,7,14,30,50,100,365], got ${JSON.stringify(mileDays)}`);

  // --- achievements ---
  const currencyIdSet = currencyIds;
  for (const a of D.achievements) {
    if (typeof a.check !== 'function') errors.push(`achievement ${a.id}: missing check()`);
    if (!(a.clout > 0)) errors.push(`achievement ${a.id}: non-positive clout`);
    if (a.requires && a.requires.currency && !currencyIdSet.has(a.requires.currency)) errors.push(`achievement ${a.id}: requires unknown currency "${a.requires.currency}"`);
  }

  return errors;
}

// State schema, save/load, export/import, migration. The single owner of the
// canonical shape of `state`. Nothing else in the codebase constructs or
// mutates a state object except a systems layer calling one of these helpers
// (the Effect producers land in Plan 2; they write through Actions, not here).
//
// Design intent from the spec §4 / §9:
//   - `run` is the per-run slice (reset on prestige); `meta` is the persistent
//     slice and must never be reset by a run reset.
//   - BigNum values are serialised as `"m|e"` compact strings so exact
//   values survive base64 without float drift.
//   - A save is { v, t, c, d }: version, timestamp, FNV-1a checksum over d,
//   and the encoded state payload. Corruption is detected and rejected verbatim.

const SAVE_VERSION = 1;
const KEY_PREFIX = 'snackonomics.save.';

// FNV-1a 32-bit, hex. Stable given the same string, sensitive to any change.
function checksum(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return ('00000000' + h.toString(16)).slice(-8);
}

function deepMerge(base) {
  for (let i = 1; i < arguments.length; i++) {
    const extra = arguments[i];
    if (!extra || typeof extra !== 'object') continue;
    for (const k of Object.keys(extra)) {
      const v = extra[k];
      if (v && typeof v === 'object' && !Array.isArray(v) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) {
        base[k] = deepMerge(base[k], v);
      } else {
        base[k] = v;
      }
    }
  }
  return base;
}

// BigNum -> "m|e", and back. BigNums are the only values that serialise with a
// `|` separator; every other field is plain JSON-compatible data.
function encodeState(v) {
  if (v && typeof v === 'object' && !Array.isArray(v)) {
    const keys = Object.keys(v);
    if (keys.length === 2 && typeof v.m === 'number' && typeof v.e === 'number') {
      return v.m + '|' + v.e;
    }
    const out = {};
    for (const k of keys) out[k] = encodeState(v[k]);
    return out;
  }
  if (Array.isArray(v)) return v.map(encodeState);
  return v;
}

function decodeState(v) {
  if (typeof v === 'string' && v.indexOf('|') !== -1) {
    const idx = v.indexOf('|');
    const m = Number(v.slice(0, idx));
    const e = Number(v.slice(idx + 1));
    if (Number.isFinite(m) && Number.isInteger(e)) return { m, e };
    return v;
  }
  if (Array.isArray(v)) return v.map(decodeState);
  if (v && typeof v === 'object') {
    const out = {};
    for (const k of Object.keys(v)) out[k] = decodeState(v[k]);
    return out;
  }
  return v;
}

function toBase64(json) {
  if (typeof Buffer !== 'undefined') return Buffer.from(json, 'utf8').toString('base64');
  return btoa(unescape(encodeURIComponent(json)));
}
function fromBase64(b64) {
  if (typeof Buffer !== 'undefined') return Buffer.from(b64, 'base64').toString('utf8');
  return decodeURIComponent(escape(atob(b64)));
}

function newState(now = Date.now()) {
  return {
    saveVersion: SAVE_VERSION,
    run: {
      foodLevel: 1,
      lifetimeGreaseThisRun: { m: 0, e: 0 },
      currencies: {
        grease: { m: 0, e: 0 },
        fry: { m: 0, e: 0 },
        fizz: { m: 0, e: 0 },
        chicken: { m: 0, e: 0 },
        spice: { m: 0, e: 0 },
      },
      upgrades: {},
      employees: {},
      automation: {},
      activeBoosters: [],
      combo: { count: 0, lastClickAt: 0 },
      runStartedAt: now,
    },
    meta: {
      prestigeLevel: 0,
      culinaryCredits: 0,
      prestigeUpgrades: {},
      achievements: {},
      chestPity: { noEpic: 0, noLegendary: 0 },
      daily: { lastClaimDate: null, streakCount: 0 },
      streak: { count: 0, best: 0 },
      streakFreezes: 0,
      streakMilestonesClaimed: {},
      boosterInventory: {},
      permanentBonuses: { goldenBurger: false },
      stats: {
        clicks: 0, crits: 0, megas: 0, jackpots: 0,
        comboMax: 0, comboDestroyed: 0, chestsOpened: 0,
        boostersActivated: 0, playtimeMs: 0, streakFreezesUsed: 0,
        greasePerSec: { m: 0, e: 0 },
      },
      clout: { m: 0, e: 0 },
      cloutSpent: { m: 0, e: 0 },
      unlockedTabs: [],
      seen: {},
    },
    settings: {
      sound: true,
      music: true,
      soundVol: 80,
      musicVol: 60,
      reducedMotion: false,
      crt: true,
      notation: 'standard',
      textScale: 100,
      confirmThreshold: 1e12,
      autosaveIndicator: true,
    },
    timestamps: { lastSeen: now, created: now },
  };
}

const MIGRATIONS = {
  // 0 -> 1: fill the shape with the current canonical one, then keep every
  // field from the raw save. The example stub below.
  0: function zeroToOne(raw) {
    return deepMerge(newState(Date.now()), raw, { saveVersion: SAVE_VERSION });
  },
};

function migrate(raw) {
  if (!raw || typeof raw !== 'object') return { ok: false, error: 'save is not an object' };
  if (typeof raw.saveVersion !== 'number') raw = { ...raw, saveVersion: 0 };
  if (raw.saveVersion > SAVE_VERSION) {
    return { ok: false, error: `save is from a newer version (${raw.saveVersion}) and cannot be loaded` };
  }
  let s = raw;
  while (s.saveVersion < SAVE_VERSION) {
    const step = MIGRATIONS[s.saveVersion];
    if (typeof step !== 'function') return { ok: false, error: `no migration registered from version ${s.saveVersion}` };
    s = step(s);
  }
  return { ok: true, state: s };
}

// Structural validation of a decoded save. Clamps/rejects out-of-range numbers
// and malformed shapes. Returns a list of human-readable errors; empty = valid.
function validateSaveBlob(raw) {
  const errors = [];
  if (!raw || typeof raw !== 'object') return ['save is not an object'];
  if (!raw.run || typeof raw.run !== 'object') {
    errors.push('missing run object');
  } else {
    const fl = raw.run.foodLevel;
    if (!Number.isInteger(fl) || fl < 1 || fl > 50) errors.push(`foodLevel must be an integer in 1..50 (got ${JSON.stringify(fl)})`);
    if (!raw.run.currencies || typeof raw.run.currencies !== 'object') {
      errors.push('missing run.currencies');
    } else {
      for (const k of ['grease', 'fry', 'fizz', 'chicken', 'spice']) {
        const c = raw.run.currencies[k];
        if (!c || typeof c.m !== 'number' || !Number.isFinite(c.m) || typeof c.e !== 'number' || !Number.isInteger(c.e) || c.e < -1000 || c.e > 1000) {
          errors.push(`currency "${k}" has an invalid BigNum value ${JSON.stringify(c)}`);
        }
      }
    }
    if (!Array.isArray(raw.run.activeBoosters)) errors.push('run.activeBoosters must be an array');
  }
  if (!raw.meta || typeof raw.meta !== 'object') {
    errors.push('missing meta object');
  } else {
    if (!raw.meta.permanentBonuses || typeof raw.meta.permanentBonuses !== 'object') errors.push('missing meta.permanentBonuses');
  }
  if (!raw.settings || typeof raw.settings !== 'object') errors.push('missing settings');
  if (!raw.timestamps || typeof raw.timestamps !== 'object') errors.push('missing timestamps');
  return errors;
}

function exportSave(state) {
  const d = encodeState(state);
  const dJson = JSON.stringify(d);
  const c = checksum(dJson);
  return toBase64(JSON.stringify({ v: SAVE_VERSION, t: Date.now(), c, d }));
}

function importSave(str) {
  const fail = (errors) => ({ ok: false, errors });
  let obj;
  try {
    obj = JSON.parse(fromBase64(str));
  } catch {
    return fail(['save is not valid base64-encoded JSON']);
  }
  try {
    if (!obj || typeof obj !== 'object' || obj.d === undefined || typeof obj.d !== 'object') {
      return fail(['malformed save: missing data section "d"']);
    }
    if (typeof obj.v !== 'number') return fail(['missing or invalid saveVersion']);
    if (obj.v > SAVE_VERSION) return fail([`saveVersion ${obj.v} is newer than supported ${SAVE_VERSION}`]);

    const dJson = JSON.stringify(obj.d);
    if (checksum(dJson) !== obj.c) return fail(['checksum mismatch — save appears corrupted']);

    const decoded = decodeState(obj.d);
    const vErr = validateSaveBlob(decoded);
    if (vErr.length > 0) return fail(vErr);

    const mig = migrate(decoded);
    if (!mig.ok) return fail([mig.error]);

    const st = mig.state;
    return {
      ok: true,
      state: st,
      errors: [],
      preview: {
        level: st.run.foodLevel,
        lifetimeGrease: st.run.lifetimeGreaseThisRun,
      },
    };
  } catch (err) {
    return fail([String((err && err.message) || err)]);
  }
}

function keyFor(slot) { return KEY_PREFIX + slot; }

function saveGame(state, store, slot = 'main') {
  try {
    store.setItem(keyFor(slot), exportSave(state));
    return true;
  } catch {
    return false;
  }
}

function loadGame(store, slot = 'main') {
  const fallback = slot === 'main' ? 'backup' : 'main';
  try {
    const raw = store.getItem(keyFor(slot));
    if (raw != null) {
      const out = importSave(raw);
      if (out.ok) return out.state;
    }
    const bak = store.getItem(keyFor(fallback));
    if (bak != null) {
      const out2 = importSave(bak);
      if (out2.ok) return out2.state;
    }
  } catch { /* ignore */ }
  return newState();
}

// Offline earnings. Closed-form, no tick simulation. Given the production rate
// frozen at save time, integrate it over the absence window. The one subtlety:
// boosters that expired while the player was away must only count for the share
// of the window they were actually active. This is integrated by collecting the
// boundary points (window start/end plus each booster's clipped start/end),
// sorting them, and summing dt*multiplier across each sub-interval.

function multOf(boost) {
  if (boost && boost.effect && typeof boost.effect.value === 'number') return boost.effect.value;
  const m = /^x([\d.]+)/.exec(typeof (boost && boost.id) === 'string' ? boost.id : '');
  if (m) {
    const v = Number(m[1]);
    if (Number.isFinite(v) && v > 0) return v;
  }
  return 1;
}

function computeOffline(state, nowMs, productionPerSec) {
  const last = state && state.timestamps && typeof state.timestamps.lastSeen === 'number'
    ? state.timestamps.lastSeen : 0;
  const elapsedMs = Math.max(0, nowMs - last);
  const maxMs = CONFIG.OFFLINE.maxHours * 3600 * 1000;
  const capped = elapsedMs > maxMs;
  const windowMs = Math.min(elapsedMs, maxMs);

  const t0 = last;
  const t1 = last + windowMs;

  const boosts = state && state.run && Array.isArray(state.run.activeBoosters)
    ? state.run.activeBoosters : [];

  const pts = new Set([t0, t1]);
  for (const b of boosts) {
    const s0 = Math.max(b.startedAt, t0);
    const s1 = Math.min(b.expiresAt, t1);
    if (s1 > s0) { pts.add(s0); pts.add(s1); }
  }
  const sorted = [...pts].sort((a, b) => a - b);

  let activeWeightedMs = 0;
  for (let i = 0; i < sorted.length - 1; i++) {
    const a = sorted[i];
    const b = sorted[i + 1];
    if (b <= a) continue;
    let prodMult = 1;
    for (const boost of boosts) {
      if (boost.startedAt <= a && boost.expiresAt > a) prodMult *= multOf(boost);
    }
    activeWeightedMs += (b - a) * prodMult;
  }

  const rate = typeof productionPerSec === 'function' ? productionPerSec() : productionPerSec;
  const prodVal = rate && typeof rate.m === 'number' && typeof rate.e === 'number'
    ? rate.m * Math.pow(10, rate.e) : 0;
  const total = prodVal * (activeWeightedMs / 1000) * CONFIG.OFFLINE.efficiency;

  return {
    elapsedMs: windowMs,
    capped,
    cappedMs: windowMs,
    gains: { grease: BigNum.fromNumber(total) },
  };
}

// Plan 2 · Task 1: Selectors. Pure, read-only views of state used by every
// later system (systems, progression, chests, daily, achievements, purchases,
// the balance simulator) and by the Plan 4 UI. No selector mutates state.
//
// Effect-value convention (documented, single source of truth):
//   An upgrade/employee effect value `v` on a MULTIPLIER type (prodMult,
//   clickMult, fryRate, fizzRate, chickenRate, critMult) reads as a fractional
//   bonus in percent within one effect "category" (an upgrade tree, the whole
//   employee pool, or the active-booster set). Within a category they ADD in
//   percent, then the per-category factors MULTIPLY, so:
//        factor = product over category of ( 1 + sum_v / 100 )
//   An ADDITIVE stat type (critChance, boosterDuration, chestLuck, offlineEff,
//   costReduction, spiceGain, cloutGain, comboDecayResist) reads as a percent
//   bonus on its scalar base:
//        factor = 1 + sum_v / 100            (a single product, not per-category)
//
// Boosters in the active set act as a separate category but their values are
// treated as direct multipliers on production/clicking (×2 == ×2), see
// Sel.boosterProdFactor / Sel.boosterClickFactor. Their total is soft-capped
// by CONFIG.BOOSTER.softCap.

const MULT_TYPES = new Set(['prodMult','clickMult','fryRate','fizzRate','chickenRate','critMult']);
const ADD_TYPES = new Set(['critChance','boosterDuration','chestLuck','offlineEff','costReduction','spiceGain','cloutGain','comboDecayResist']);

// Collect every owned effect contribution by effect type, split by additive
// category for multiplier types.
function gather(s) {
  const perCategory = {}; // type -> { category -> sum }
  const additive = {};    // type -> totalFraction (sum of value)
  const foldType = { has: false };
  for (const id of Object.keys(s.run.upgrades || {})) {
    const u = DATA.upgradeById.get(id);
    if (!u || !u.effect) continue;
    if (MULT_TYPES.has(u.effect.type)) {
      perCategory[u.effect.type] = perCategory[u.effect.type] || {};
      perCategory[u.effect.type][u.tree] = (perCategory[u.effect.type][u.tree] || 0) + u.effect.value;
    } else if (ADD_TYPES.has(u.effect.type)) {
      additive[u.effect.type] = (additive[u.effect.type] || 0) + u.effect.value;
    }
  }
  for (const id of Object.keys(s.run.employees || {})) {
    const emp = DATA.employeeById.get(id);
    const count = s.run.employees[id] || 0;
    if (!emp || !emp.effect || count <= 0) continue;
    // An employee's effect is a flat bonus for owning that
    // type, applied once. The per-count scaling lives in the
    // milestone track (CONFIG.MILESTONES.employee), which
    // already multiplies that worker's flat rate at 25/50/
    // 100/200 owned. Stacking the effect per hire would let
    // a few thousand workers multiply the entire economy
    // without bound, which collapses the pacing curve.
    if (MULT_TYPES.has(emp.effect.type)) {
      perCategory[emp.effect.type] = perCategory[emp.effect.type] || {};
      perCategory[emp.effect.type].employee = (perCategory[emp.effect.type].employee || 0) + emp.effect.value;
    } else if (ADD_TYPES.has(emp.effect.type)) {
      additive[emp.effect.type] = (additive[emp.effect.type] || 0) + emp.effect.value;
    }
  }
  return { perCategory, additive };
}

function factorOfType(perCategory, type) {
  const byCat = perCategory[type];
  if (!byCat) return 1;
  let product = 1;
  for (const cat of Object.keys(byCat)) {
    product *= (1 + byCat[cat] / 100);
  }
  return product;
}

function additiveFactor(additive, type) {
  return 1 + (additive[type] || 0) / 100;
}

function activeBoosters(s) {
  // A booster counts only until its expiry. The runtime prunes on each
  // tick (see expireBoosters); this filter is the defensive backstop so
  // a stale entry can never inflate production between ticks.
  const now = (s.timestamps && s.timestamps.lastSeen) || 0;
  return (s.run.activeBoosters || []).filter(b => b.expiresAt === undefined || b.expiresAt > now);
}

function boosterOfType(s, type) {
  let product = 1;
  for (const b of activeBoosters(s)) {
    const def = DATA.boosters.find(x => x.id === b.id);
    if (!def || !def.effect || def.effect.type !== type) continue;
    const v = typeof def.effect.value === 'number' ? def.effect.value : 1;
    product *= v;
  }
  if (product > CONFIG.BOOSTER.softCap) product = CONFIG.BOOSTER.softCap;
  return product;
}

function employeeMilestoneFactor(count) {
  let m = 1;
  const tiers = CONFIG.MILESTONES.employee;
  for (const threshold of [25, 50, 100, 200]) {
    if (count >= threshold && tiers[threshold]) m *= tiers[threshold];
  }
  return m;
}

function comboMultiplier(s) {
  const count = (s.run.combo && s.run.combo.count) || 0;
  let v = 1;
  for (const t of CONFIG.COMBO.tiers) if (count >= t.at) v = t.v;
  return v;
}

const Sel = {
  // The full 14-slot effect map. Multiplier types are composite factors
  // (multiplicative across categories, additive within); additive types are a
  // single percent-of-base bonus factor.
  effects(s) {
    const { perCategory, additive } = gather(s);
    const out = {};
    for (const t of MULT_TYPES) out[t] = factorOfType(perCategory, t);
    for (const t of ADD_TYPES) out[t] = additiveFactor(additive, t);
    out.forceCrit = activeBoosters(s).some(b => {
      const d = DATA.boosters.find(x => x.id === b.id);
      return d && d.effect && d.effect.type === 'forceCrit';
    });
    return out;
  },

  boosterProdFactor(s) { return boosterOfType(s, 'prodMult'); },
  boosterClickFactor(s) { return boosterOfType(s, 'clickMult'); },

  permanentFactor(s) {
    return s.meta && s.meta.permanentBonuses && s.meta.permanentBonuses.goldenBurger ? 2 : 1;
  },

  prodMult(s) {
    const eff = Sel.effects(s);
    return eff.prodMult * Sel.boosterProdFactor(s) * Sel.permanentFactor(s);
  },
  clickMult(s) {
    return Sel.effects(s).clickMult * Sel.boosterClickFactor(s);
  },
  comboMult(s) { return comboMultiplier(s); },

  // Effective crit inputs (used by the click action)
  critChance(s) { return CONFIG.CRIT_CHANCE_BASE * Sel.effects(s).critChance; },
  critMult(s)   { return Sel.effects(s).critMult * CONFIG.CRIT.multCritical; },

  // Production tree contributions (per-category for Fry/Fizz/Chicken)
  fryRateMult(s)    { return Sel.effects(s).fryRate; },
  fizzRateMult(s)   { return Sel.effects(s).fizzRate; },
  chickenRateMult(s){ return Sel.effects(s).chickenRate; },

  // Task 2 production math lives below. clickCore is bootstrapped first so
  // automation multiplies it without a circular dependency on greasePerSec.
};

function big(n) { return { m: n, e: 0 }; }

function _mul(a, b) {
  return BigNum.mul(a, b);
}

// Auto-click grease: automation rate is clicks/sec; each click yields clickCore.
function autoGrease(s, clickCoreBn) {
  let total = big(0);
  for (const id of Object.keys(s.run.automation || {})) {
    const a = DATA.automationById.get(id);
    const count = s.run.automation[id] || 0;
    if (!a || count <= 0) continue;
    total = BigNum.add(total, BigNum.mul(big(a.rate * count), clickCoreBn));
  }
  return total;
}

// Employee grease: flat rate per worker, scaled by how many thresholds that
// worker crosses. Multiplier employees' effects are already in Sel.effects.
function empGrease(s) {
  let total = big(0);
  for (const id of Object.keys(s.run.employees || {})) {
    const e = DATA.employeeById.get(id);
    const count = s.run.employees[id] || 0;
    if (!e || count <= 0) continue;
    total = BigNum.add(total, BigNum.mul(big(e.rate * count), big(employeeMilestoneFactor(count))));
  }
  return total;
}

Sel.clickCore = function (s) {
  // Click power stripped of the production link, so automation interacts with
  // it without a circular dependency (spec §6).
  return BigNum.mul(big(CONFIG.CLICK_BASE), big(Sel.clickMult(s)));
};

Sel.greasePerSec = function (s) {
  const clickCore = Sel.clickCore(s);
  const autos = autoGrease(s, clickCore);
  const emps = empGrease(s);
  const base = BigNum.add(autos, emps);
  return BigNum.mul(base, big(Sel.prodMult(s)));
};

Sel.clickPower = function (s) {
  // Per-tap gain (before crits). Scales with production so clicking stays
  // relevant late (spec §6, §5.5).
  const linked = BigNum.mul(big(CONFIG.LINK_RATE), Sel.greasePerSec(s));
  const base = BigNum.add(big(CONFIG.CLICK_BASE), linked);
  return BigNum.mul(base, BigNum.mul(big(Sel.clickMult(s)), big(Sel.comboMult(s))));
};

Sel.fryPerSec    = function (s) { return BigNum.mul(Sel.greasePerSec(s), big(CONFIG.LINK2 * Sel.fryRateMult(s))); };
Sel.fizzPerSec   = function (s) { return BigNum.mul(Sel.greasePerSec(s), big(CONFIG.LINK2 * Sel.fizzRateMult(s))); };
Sel.chickenPerSec= function (s) { return BigNum.mul(Sel.greasePerSec(s), big(CONFIG.LINK2 * Sel.chickenRateMult(s))); };

Sel.costOf = function (s, kind, id, count) {
  // The cost of the next `count` units of a repeatable purchase
  // (employee or automation), starting from `count` already
  // owned: baseCost * growth^count. Upgrades are a one-time
  // fixed price.
  let item;
  if (kind === 'employee') item = DATA.employeeById.get(id);
  else if (kind === 'automation') item = DATA.automationById.get(id);
  else if (kind === 'upgrade') item = DATA.upgradeById.get(id);
  if (!item) return null;
  if (kind === 'employee' || kind === 'automation') {
    const growth = item.growth || 1;
    let cost = BigNum.fromNumber(item.cost.amount);
    for (let i = 0; i < count; i++) cost = BigNum.mul(cost, big(growth));
    return { currency: item.cost.currency, amount: cost };
  }
  return { currency: item.cost.currency, amount: BigNum.fromNumber(item.cost.amount) };
};

Sel.canAfford = function (s, cost) {
  if (!cost) return false;
  const bal = s.run.currencies[cost.currency];
  if (!bal) return false;
  return BigNum.cmp(bal, cost.amount) >= 0;
};

// Plan 2 · Task 2: Systems — thin production entry points around the Sel
// math so higher systems (progression, chests, dailies, actions) and Plan 4
// can call a stable name without reaching into Sel internals.
//
// computeGrease is the per-second Grease right now (the core income number).
// computeRate is that same quantity exposed for rate-display panels.
// Both are pure reads and must not mutate state.

function computeGrease(s) {
  return Sel.greasePerSec(s);
}

function computeRate(s) {
  return Sel.greasePerSec(s);
}

// Plan 2 · Task 3: Purchase actions. The only place the economy mutates the
// catalogue slices of state: { upgrades, employees, automation } and the
// currency that pays for them. Everything else reads what these write through
// Sel. Each buy returns { ok, changed? , reason? } and never throws — a failed
// affordability check is a normal result, not an exception.

function newBig(m, e) { return { m, e }; }

function automationTotalCost(s, id, count) {
  const a = DATA.automationById.get(id);
  if (!a) return null;
  let total = newBig(0, 0);
  const owned = (s.run.automation[id] || 0);
  for (let i = 0; i < count; i++) {
    const unit = BigNum.fromNumber(a.cost.amount);
    let p = BigNum.fromNumber(1);
    for (let g = 0; g < owned + i; g++) p = BigNum.mul(p, newBig(a.growth || 1, 0));
    total = BigNum.add(total, BigNum.mul(unit, p));
  }
  return { currency: a.cost.currency, amount: total };
}

const buy = {
  buyUpgrade(s, id) {
    const u = DATA.upgradeById.get(id);
    if (!u) return { ok: false, reason: `unknown upgrade "${id}"` };
    if (s.run.upgrades[id]) return { ok: false, reason: 'already owned' };
    if (u.levelReq && s.run.foodLevel < u.levelReq) return { ok: false, reason: `requires food level ${u.levelReq}, currently ${s.run.foodLevel}` };
    const missing = (u.requires || []).filter(r => !s.run.upgrades[r]);
    if (missing.length > 0) return { ok: false, reason: `missing prerequisites: ${missing.join(', ')}` };
    const cost = Sel.costOf(s, 'upgrade', id, 0);
    if (!Sel.canAfford(s, cost)) return { ok: false, reason: `not enough ${cost.currency}` };
    s.run.currencies[cost.currency] = BigNum.sub(s.run.currencies[cost.currency], cost.amount);
    s.run.upgrades[id] = true;
    return { ok: true, changed: { upgrade: id } };
  },

  buyEmployee(s, id, n = 1) {
    const e = DATA.employeeById.get(id);
    if (!e) return { ok: false, reason: `unknown employee "${id}"` };
    // The next n hires cost base * growth^owned * (growth^n - 1)/(growth - 1),
    // so each additional worker of the same type costs more than the last.
    const growth = e.growth || 1;
    const owned = s.run.employees[id] || 0;
    let unit = BigNum.fromNumber(e.cost.amount);
    for (let i = 0; i < owned; i++) unit = BigNum.mul(unit, newBig(growth, 0));
    let total = BigNum.fromNumber(0);
    let u = unit;
    for (let i = 0; i < n; i++) {
      total = BigNum.add(total, u);
      u = BigNum.mul(u, newBig(growth, 0));
    }
    if (!Sel.canAfford(s, { currency: e.cost.currency, amount: total })) {
      return { ok: false, reason: `not enough ${e.cost.currency}` };
    }
    s.run.currencies[e.cost.currency] = BigNum.sub(s.run.currencies[e.cost.currency], total);
    s.run.employees[id] = owned + n;
    return { ok: true, changed: { employee: id, n } };
  },

  buyAutomation(s, id, n = 1) {
    const a = DATA.automationById.get(id);
    if (!a) return { ok: false, reason: `unknown automation "${id}"` };
    const total = automationTotalCost(s, id, n);
    if (!Sel.canAfford(s, { currency: total.currency, amount: total.amount })) {
      return { ok: false, reason: `not enough ${total.currency}` };
    }
    s.run.currencies[total.currency] = BigNum.sub(s.run.currencies[total.currency], total.amount);
    s.run.automation[id] = (s.run.automation[id] || 0) + n;
    return { ok: true, changed: { automation: id, n } };
  },
};

// Plan 2 · Task 4: Food-level progression. Lifetime Grease (run.lifetimeGreaseThisRun)
// decides the current food level. The food definitions carry a required lifetime to
// advance past them; crossing it advances s.run.foodLevel (capped at 50). Once the
// player is at THE OMNIFOOD, surplus lifetime past its threshold rolls into Omni
// Ascensions instead of ending the game.

function lifeVal(s) {
  const bn = s.run.lifetimeGreaseThisRun;
  if (!bn || typeof bn.m !== 'number') return 0;
  return BigNum.toNumber(bn);
}

function currentFood(s) {
  return DATA.foodLevels[Math.max(0, Math.min(s.run.foodLevel - 1, DATA.foodLevels.length - 1))];
}

// Returns true if the food level advanced on this call. Level ups are the
// moment the scene re-paints; the caller is responsible for that, and for
// granting any chest owed by a level-up milestone.
function tickProgression(s) {
  let advanced = false;
  const life = lifeVal(s);
  while (s.run.foodLevel < DATA.foodLevels.length) {
    const toBeat = DATA.foodLevels[s.run.foodLevel - 1];
    if (life >= toBeat.threshold) {
      s.run.foodLevel += 1;
      advanced = true;
    } else break;
  }
  if (s.run.foodLevel >= DATA.foodLevels.length) {
    const dok = DATA.foodLevels[DATA.foodLevels.length - 1].threshold;
    const oc = Math.max(0, Math.floor((life - dok) / dok) + 1);
    s.meta.stats.omniAscensions = Math.max(s.meta.stats.omniAscensions || 0, oc);
  }
  return advanced;
}

// Plan 2 · Task 5: Chests, pity, opening rewards. Opening a chest rolls one
// entry from that tier's weighted table, then applies the pity floors: a string
// of low outcomes builds up noEpic / noLegendary, and once the counter hits the
// spec threshold the next roll is guaranteed to be a higher-tier reward. This
// module grants the reward onto the appropriate slice of state (currencies,
// booster inventory, owned upgrades, or records a buff) and updates pity.

const RARITY_ORDER = ['common','uncommon','rare','epic','legendary','mythic','secret'];

function rarityRank(r) { const i = RARITY_ORDER.indexOf(r); return i < 0 ? 0 : i; }

// A reward counts as "high" if it is not a plain currency drop. Buffs exist to
// be something-ness; upgrades always are. Boosters count as high by their rarity.
function isHighReward(entry) {
  if (entry.kind === 'upgrade' || entry.kind === 'buff') return true;
  if (entry.kind === 'booster') {
    const b = DATA.boosters.find(x => x.id === entry.id);
    return b ? rarityRank(b.rarity) >= 2 /* rare+ */ : false;
  }
  return false;
}

function isLegendaryHigh(entry) {
  if (entry.kind === 'upgrade') return true;
  if (entry.kind === 'booster') {
    const b = DATA.boosters.find(x => x.id === entry.id);
    return b ? rarityRank(b.rarity) >= 4 /* legendary+ */ : false;
  }
  return false;
}

function tableFor(tier) {
  return DATA.chestTables.find(t => t.tier === tier);
}

function weightedPick(entries, rand) {
  let total = 0;
  for (const e of entries) total += e.weight;
  if (total <= 0) return entries[entries.length - 1];
  let r = rand() * total;
  for (const e of entries) {
    r -= e.weight;
    if (r < 0) return e;
  }
  return entries[entries.length - 1];
}

function grantReward(state, entry) {
  if (entry.kind === 'currency') {
    const cur = state.run.currencies[entry.id];
    if (cur) state.run.currencies[entry.id] = BigNum.add(cur, BigNum.fromNumber(entry.amount));
  } else if (entry.kind === 'booster') {
    state.meta.boosterInventory[entry.id] = (state.meta.boosterInventory[entry.id] || 0) + entry.amount;
  } else if (entry.kind === 'upgrade') {
    state.run.upgrades[entry.id] = true;
  } else if (entry.kind === 'buff') {
    state.meta.lastBuffs = state.meta.lastBuffs || [];
    state.meta.lastBuffs.push(entry.id);
  }
  return entry;
}

function openChest(state, tier, rand = Math.random) {
  const table = tableFor(tier);
  if (!table) return { ok: false, reason: `unknown chest tier ${tier}` };

  const cfg = DATA.chestPity;
  const run = state.meta.chestPity;

  let entry;
  if (run.noLegendary >= cfg.legendaryAfter) {
    const pool = table.entries.filter(isLegendaryHigh);
    entry = pool.length > 0 ? weightedPick(pool, rand) : weightedPick(table.entries, rand);
  } else if (run.noEpic >= cfg.epicAfter) {
    const pool = table.entries.filter(isHighReward);
    entry = pool.length > 0 ? weightedPick(pool, rand) : weightedPick(table.entries, rand);
  } else {
    entry = weightedPick(table.entries, rand);
  }

  const wasHigh = isHighReward(entry);
  const wasLegendary = isLegendaryHigh(entry);
  run.noEpic = wasHigh ? 0 : run.noEpic + 1;
  run.noLegendary = wasLegendary ? 0 : run.noLegendary + 1;

  grantReward(state, entry);
  return { ok: true, tier, reward: entry, pity: { noEpic: run.noEpic, noLegendary: run.noLegendary } };
}

// Plan 2 · Task 6: Daily rewards and streak aging.
//
// A claim is keyed on the player's own calendar day (dkey, local time).
// The decision table, driven by the signed gap between the last claimed
// day and today:
//
//   last === null            -> first ever claim, streak becomes 1
//   last === today           -> refuse (no double-grant)
//   gap <= 0                 -> refuse (clock moved backward / a timezone
//                               hop landed the player back on a past day)
//   gap === 1                -> consecutive: streak + 1
//   gap > 1, freeze held     -> consume a Streak Freeze, streak + 1
//   gap > 1, no freeze       -> streak resets to 1
//
// The todayKey parameter is a seam for tests: production passes nothing
// and reads dkey(now); tests pass an explicit 'YYYY-MM-DD' so the logic
// is deterministic on any machine timezone.

function applyReward(state, r) {
  if (r.kind === 'currency') {
    if (r.id === 'clout') {
      // Clout is a meta currency, not a run currency.
      state.meta.clout = BigNum.add(state.meta.clout, BigNum.fromNumber(r.amount));
    } else {
      const cur = state.run.currencies[r.id] || { m: 0, e: 0 };
      state.run.currencies[r.id] = BigNum.add(cur, BigNum.fromNumber(r.amount));
    }
  } else if (r.kind === 'booster') {
    state.meta.boosterInventory[r.id] = (state.meta.boosterInventory[r.id] || 0) + r.amount;
  } else if (r.kind === 'permanent') {
    if (r.id === 'golden-burger') state.meta.permanentBonuses.goldenBurger = true;
  }
  return r;
}

function grantDaily(state, today, streak, meta) {
  // The calendar runs 30 days; past that the last entry repeats, and its
  // permanent reward is idempotent (already granted).
  const day = Math.min(Math.max(streak, 1), DATA.dailyCalendar.length);
  const entry = DATA.dailyCalendar[day - 1];
  const granted = entry ? entry.rewards.map(r => applyReward(state, r)) : [];

  // Streak milestones fire once per exact streak value, ever.
  let milestoneGranted = null;
  const milestone = DATA.streakMilestones.find(m => m.day === streak);
  if (milestone && !state.meta.streakMilestonesClaimed[milestone.day]) {
    state.meta.streakMilestonesClaimed[milestone.day] = true;
    milestoneGranted = milestone.rewards.map(r => applyReward(state, r));
  }

  state.meta.daily.lastClaimDate = today;
  state.meta.daily.streakCount = streak;
  state.meta.streak.count = streak;
  if (streak > state.meta.streak.best) state.meta.streak.best = streak;
  return { ok: true, streak, granted, milestoneGranted, ...meta };
}

function claimDaily(state, now = Date.now(), todayKey) {
  const today = todayKey || dkey(now);
  const last = state.meta.daily.lastClaimDate;

  if (last === null) return grantDaily(state, today, 1, { first: true });
  if (last === today) {
    return { ok: false, reason: 'already-claimed', streak: state.meta.daily.streakCount };
  }

  const gap = daysBetween(last, today);
  if (!Number.isFinite(gap)) return { ok: false, reason: 'bad-date', streak: state.meta.daily.streakCount };
  if (gap <= 0) {
    // The clock rolled back, or a timezone hop put the player back on a
    // day they already claimed. Never re-grant.
    return { ok: false, reason: 'clock-backward', streak: state.meta.daily.streakCount };
  }
  if (gap === 1) {
    return grantDaily(state, today, state.meta.daily.streakCount + 1, { consecutive: true });
  }

  // gap > 1: the player missed days. A Streak Freeze bridges exactly one
  // missed day, keeping the streak alive; without one it resets.
  if ((state.meta.streakFreezes || 0) > 0) {
    state.meta.streakFreezes -= 1;
    state.meta.stats.streakFreezesUsed = (state.meta.stats.streakFreezesUsed || 0) + 1;
    return grantDaily(state, today, state.meta.daily.streakCount + 1, { usedFreeze: true });
  }
  return grantDaily(state, today, 1, { reset: true });
}

// Read-only view for the UI: is there a claim waiting, and why not?
function dailyStatus(state, now = Date.now(), todayKey) {
  const today = todayKey || dkey(now);
  const last = state.meta.daily.lastClaimDate;
  if (last === null) return { claimable: true, streak: state.meta.daily.streakCount };
  if (last === today) return { claimable: false, reason: 'already-claimed', streak: state.meta.daily.streakCount };
  const gap = daysBetween(last, today);
  if (!Number.isFinite(gap) || gap <= 0) {
    return { claimable: false, reason: 'clock-backward', streak: state.meta.daily.streakCount };
  }
  if (gap === 1) return { claimable: true, streak: state.meta.daily.streakCount + 1 };
  return { claimable: true, streak: 1, reason: (state.meta.streakFreezes || 0) > 0 ? 'freeze-available' : 'streak-will-reset' };
}

// Plan 2 · Task 7: Achievement evaluation. Each achievement carries a
// `check(state)` predicate written against the stats counters the
// systems layer maintains. The evaluator walks all of them, unlocks
// any whose check flips true, pays its clout once, and never pays
// twice. Hidden achievements unlock and pay like any other -- they
// are merely withheld from the visible list the UI renders.

function evaluateAchievements(state) {
  const newly = [];
  for (const a of DATA.achievements) {
    if (state.meta.achievements[a.id]) continue; // already unlocked, never re-paid
    let ok = false;
    try { ok = a.check(state) === true; } catch { ok = false; }
    if (ok) {
      state.meta.achievements[a.id] = true;
      newly.push(a);
      if (a.clout) state.meta.clout = BigNum.add(state.meta.clout, BigNum.fromNumber(a.clout));
    }
  }
  return newly;
}

// The achievements the UI may show: unlocked and not hidden.
function unlockedAchievements(state) {
  return DATA.achievements.filter(a => state.meta.achievements[a.id] && !a.hidden);
}

// The full unlocked count, hidden included (the "x / 115" tracker).
function unlockedCount(state) {
  let n = 0;
  for (const a of DATA.achievements) if (state.meta.achievements[a.id]) n += 1;
  return n;
}

function isUnlocked(state, id) {
  return state.meta.achievements[id] === true;
}

// Plan 2 · Task 8: The actions barrel. Everything a player can do
// that mutates state funnels through here: the click itself, the
// three buy paths, chests, dailies, boosters, and save I/O. The
// per-frame housekeeping (booster expiry, level progression,
// achievement evaluation, playtime) lives in tick().

// ---- The click ------------------------------------------------------------

// click(state, now, rand) -> { gain, tier, combo }. One tap of the
// food. Click power comes from Sel (it already folds in the
// production link, click multipliers and the combo tier). A crit
// roll then scales the gain; the crit tier's base multiplier is
// raised further by any critMult upgrades.
function click(state, now = Date.now(), rand = Math.random) {
  const combo = state.run.combo;
  if (combo.lastClickAt && (now - combo.lastClickAt) <= CONFIG.COMBO.decayMs) {
    combo.count += 1;
  } else {
    combo.count = 1;
  }
  combo.lastClickAt = now;
  if (combo.count > state.meta.stats.comboMax) state.meta.stats.comboMax = combo.count;

  const power = Sel.clickPower(state);
  const critFactor = Sel.effects(state).critMult;
  const c = CONFIG.CRIT;
  const roll = rand();

  let tier = 'normal';
  let tierMult = 1;
  if (Sel.effects(state).forceCrit) {
    tier = 'critical';
    tierMult = c.multCritical * critFactor;
  } else if (roll < c.jackpot) {
    tier = 'jackpot';
    tierMult = c.multJackpot * critFactor;
  } else if (roll < c.jackpot + c.mega) {
    tier = 'mega';
    tierMult = c.multMega * critFactor;
  } else if (roll < c.jackpot + c.mega + c.critical) {
    tier = 'critical';
    tierMult = c.multCritical * critFactor;
  }

  const gain = BigNum.mul(power, { m: tierMult, e: 0 });
  state.run.currencies.grease = BigNum.add(state.run.currencies.grease, gain);
  state.run.lifetimeGreaseThisRun = BigNum.add(state.run.lifetimeGreaseThisRun, gain);

  state.meta.stats.clicks += 1;
  if (tier === 'critical') state.meta.stats.crits += 1;
  if (tier === 'mega') state.meta.stats.megas += 1;
  if (tier === 'jackpot') state.meta.stats.jackpots += 1;

  return { gain, tier, combo: combo.count };
}

// ---- Boosters -------------------------------------------------------------

// Drop every booster whose expiry has passed. Called from tick() so
// the selectors (which are pure) only ever see live boosters.
function expireBoosters(state, now = Date.now()) {
  const live = (state.run.activeBoosters || []).filter(
    b => b.expiresAt === undefined || b.expiresAt > now
  );
  const removed = (state.run.activeBoosters || []).length - live.length;
  state.run.activeBoosters = live;
  return removed;
}

// useBooster(state, id, now) -> { ok, id?, reason?, refreshed? }.
// Moves one unit from the inventory into the active set (or refreshes
// an already-active booster's timer). Respect the max-active cap.
function useBooster(state, id, now = Date.now()) {
  const def = DATA.boosters.find(b => b.id === id);
  if (!def) return { ok: false, reason: `unknown booster "${id}"` };
  const inv = state.meta.boosterInventory[id] || 0;
  if (inv <= 0) return { ok: false, reason: 'not in inventory' };
  const existing = (state.run.activeBoosters || []).find(b => b.id === id);
  if (existing) {
    existing.startedAt = now;
    existing.expiresAt = now + def.durationMs;
    return { ok: true, id, refreshed: true };
  }
  const activeCount = (state.run.activeBoosters || []).length;
  if (activeCount >= CONFIG.BOOSTER.maxActive) {
    return { ok: false, reason: `booster limit reached (${CONFIG.BOOSTER.maxActive})` };
  }
  state.meta.boosterInventory[id] = inv - 1;
  state.run.activeBoosters.push({ id, startedAt: now, expiresAt: now + def.durationMs });
  state.meta.stats.boostersActivated = (state.meta.stats.boostersActivated || 0) + 1;
  return { ok: true, id };
}

// ---- The frame tick -------------------------------------------------------

// tick(state, now): per-frame housekeeping. Accumulates playtime,
// expires boosters, advances the food level, and evaluates
// achievements. Safe to call every frame.
function tick(state, now = Date.now()) {
  const prev = (typeof state.timestamps.lastSeen === 'number') ? state.timestamps.lastSeen : now;
  if (now > prev) state.meta.stats.playtimeMs += now - prev;
  state.timestamps.lastSeen = now;
  expireBoosters(state, now);
  tickProgression(state);
  evaluateAchievements(state);
  return state;
}
